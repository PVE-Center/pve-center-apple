name: Apple CI (SwiftPM + Xcode Multi-Platform)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apple-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-apple:
    name: Swift 6 & Xcode Multi-Platform (macOS, iOS, tvOS)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode & Swift versions
        run: |
          swift --version
          xcodebuild -version

      - name: Lint shell scripts and Info.plist
        run: |
          bash -n scripts/*.sh
          plutil -lint PVECenter/Resources/Info.plist

      - name: Build Swift Package (Swift 6)
        run: swift build

      - name: Build Xcode — macOS (unsigned)
        run: |
          xcodebuild \
            -project PVECenter.xcodeproj \
            -scheme PVECenter \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build Xcode — iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project PVECenter.xcodeproj \
            -scheme PVECenter-iOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build Xcode — tvOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project PVECenter.xcodeproj \
            -scheme PVECenter \
            -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
